<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر أوراق & كتب</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- الهيدر والبحث -->
  <header class="header">
    <div class="logo">
      <span class="icon">📚</span>
      <h1>متجر أوراق</h1>
    </div>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="ابحث باسم الكتاب أو اسم الكاتب..." oninput="handleSearchAndFilter()">
    </div>
    <div class="cart-icon-btn" onclick="toggleCartModal()">
      <span>🛒 السلة</span>
      <span id="cart-count-badge" class="badge">0</span>
    </div>
  </header>

  <!-- المحتوى الرئيسي -->
  <main class="main-container">
    
    <!-- الأقسام والفلترة -->
    <section class="filters-section">
      <h3>الأقسام</h3>
      <div class="category-buttons">
        <button class="cat-btn active" onclick="filterCategory('all', this)">الكل</button>
        <button class="cat-btn" onclick="filterCategory('روايات', this)">روايات</button>
        <button class="cat-btn" onclick="filterCategory('تطوير الذات', this)">تطوير الذات</button>
        <button class="cat-btn" onclick="filterCategory('تاريخ', this)">تاريخ وفكر</button>
        <button class="cat-btn" onclick="filterCategory('علوم', this)">علوم وتكنولوجيا</button>
      </div>
    </section>

    <!-- عرض الكتب -->
    <section class="books-section">
      <div class="section-title">
        <h2 id="current-category-title">جميع الكتب المتاحة</h2>
        <span id="books-count">0 كتاب</span>
      </div>
      <div class="books-grid" id="books-container"></div>
    </section>

  </main>

  <!-- النافذة المنبثقة للسلة (Modal Cart) -->
  <div class="cart-modal-overlay" id="cart-modal">
    <div class="cart-modal-content">
      <div class="cart-header">
        <h3>سلة التسوق 🛒</h3>
        <button class="close-btn" onclick="toggleCartModal()">&times;</button>
      </div>
      
      <div class="cart-body" id="cart-items-list"></div>

      <div class="cart-footer">
        <div class="total-row">
          <span>المجموع الكلي:</span>
          <span class="total-price"><span id="cart-total">0</span> د.ج</span>
        </div>
        <div class="cart-actions">
          <button class="btn btn-secondary" onclick="clearCart()">تفريغ السلة</button>
          <button class="btn btn-primary" onclick="checkout()">إتمام الطلب</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
