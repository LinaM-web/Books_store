<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر أوراق و كتب - Bouira</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"
</head>
<body>

    <!-- Header / Navigation Bar -->
    <header>
        <div class="nav-container">
            <!-- Logo with Image -->
            <a href="#" class="logo-container">
                <img src="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=120&q=80" alt="لوجو المتجر" class="logo-img">
                <div class="logo-text">
                    <h1>متجر أوراق و كتب</h1>
                    <span>Bouira, Algeria</span>
                </div>
            </a>

            <!-- Controls: Categories, Search & Cart -->
            <div class="nav-controls">
                <!-- Dropdown Categories -->
                <div class="dropdown" id="categoryDropdown">
                    <button class="dropdown-btn" onclick="toggleDropdown()">
                        <i class="fa-solid fa-list"></i>
                        <span>الأقسام</span>
                        <i class="fa-solid fa-chevron-down" style="font-size: 0.75rem;"></i>
                    </button>
                    <ul class="dropdown-menu">
                        <li><a href="#" onclick="filterCategory('all')"><i class="fa-solid fa-border-all"></i> جميع الكتب</a></li>
                        <li><a href="#" onclick="filterCategory('تاريخ')"><i class="fa-solid fa-landmark"></i> تاريخ</a></li>
                        <li><a href="#" onclick="filterCategory('تطوير الذات')"><i class="fa-solid fa-brain"></i> تطوير الذات</a></li>
                        <li><a href="#" onclick="filterCategory('روايات')"><i class="fa-solid fa-book-open"></i> روايات</a></li>
                        <li><a href="#" onclick="filterCategory('علوم')"><i class="fa-solid fa-atom"></i> علوم</a></li>
                    </ul>
                </div>

                <!-- Search Input -->
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="إبحث عن عنوان، مؤلف..." onkeyup="searchProducts()">
                </div>

                <!-- Quick Cart Toggle -->
                <div class="cart-icon-btn" onclick="scrollToCart()">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-badge" id="cartBadge">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-container">
        
        <!-- Products Grid Area -->
        <section class="products-section">
            <div class="section-header">
                <h2 class="section-title" id="currentCategoryTitle">
                    <i class="fa-solid fa-book"></i> جميع الكتب المتاحة
                </h2>
                <span style="font-size: 0.85rem; color: var(--text-muted);" id="productCount">عرض 4 كتب</span>
            </div>

            <div class="products-grid" id="productsGrid">
                <!-- Dynamic Products -->
            </div>
        </section>

        <!-- Sidebar Shopping Cart -->
        <aside class="cart-sidebar" id="cartSection">
            <div class="cart-header">
                <h2><i class="fa-solid fa-shopping-bag"></i> سلة التسوق</h2>
            </div>

            <div class="cart-items-list" id="cartItemsList">
                <div class="empty-cart-msg">السلة فارغة حالياً</div>
            </div>

            <div class="cart-summary">
                <div class="cart-summary-row">
                    <span>الإجمالي:</span>
                    <span id="cartTotal">0 د.ج</span>
                </div>
            </div>

            <div class="cart-actions">
                <button class="checkout-btn" onclick="openCheckoutModal()">
                    <i class="fa-solid fa-check-circle"></i> إتمام الطلب
                </button>
                <button class="clear-btn" onclick="clearCart()">
                    <i class="fa-solid fa-trash-can"></i> تفريغ السلة
                </button>
            </div>
        </aside>

    </main>

    <!-- Modal for Checkout / Order Details -->
    <div class="modal-overlay" id="checkoutModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fa-solid fa-paper-plane"></i> تفاصيل الطلب والشحن</h3>
                <button class="close-modal-btn" onclick="closeCheckoutModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <form id="orderForm" onsubmit="handleSendOrder(event)">
                    
                    <div class="form-group">
                        <label for="clientName"><i class="fa-solid fa-user"></i> الاسم الكامل</label>
                        <input type="text" id="clientName" placeholder="أدخل اسمك الكريم" required>
                    </div>

                    <div class="form-group">
                        <label for="clientPhone"><i class="fa-solid fa-phone"></i> رقم الهاتف</label>
                        <input type="tel" id="clientPhone" placeholder="06XXXXXXXX" required>
                    </div>

                    <div class="form-group">
                        <label><i class="fa-solid fa-truck-ramp-box"></i> مكان الاستلام</label>
                        <div class="radio-group">
                            <label class="radio-option">
                                <input type="radio" name="deliveryType" value="توصيل للمنزل" checked>
                                المنزل
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="deliveryType" value="استلام من المكتب">
                                المكتب / المقر
                            </label>
                        </div>
                    </div>

                    <div class="form-group" style="margin-top: 1rem;">
                        <label for="clientWilaya"><i class="fa-solid fa-location-dot"></i> الولاية / العنوان</label>
                        <input type="text" id="clientWilaya" placeholder="مثال: البويرة - وسط المدينة" required>
                    </div>

                    <div style="background-color: #f8faf9; padding: 0.8rem; border-radius: 8px; margin: 1rem 0; border: 1px solid #e2e8f0;">
                        <div style="display: flex; justify-content: space-between; font-weight: bold; color: var(--primary-color);">
                            <span>السعر الكامل للطلب:</span>
                            <span id="modalTotalPrice">0 د.ج</span>
                        </div>
                    </div>

                    <button type="submit" class="send-order-btn">
                        <i class="fa-brands fa-whatsapp" style="font-size: 1.2rem;"></i> إرسال الطلب عبر الواتساب
                    </button>
                </form>
            </div>
        </div>
    </div>
  <script src="script.js"></script>
</body>
</html>
